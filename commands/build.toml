description = "Implement tasks incrementally — build, test, verify, propose commit. Add \"auto\" to run the whole plan in one approved pass."

prompt = """
Invoke the incremental-implementation skill alongside test-driven-development.

## Modes

- `/build` — implement the next pending task, then stop (careful, one slice at a time).
- `/build auto` — generate the plan if needed, get a single approval, then implement every task without stopping between them.

The arguments select the mode. Treat `auto` (canonical) or `all` as autonomous mode; anything else (or empty) is the default single-task mode. Note: autonomous mode is not faster per task — it runs the same test-driven loop — it only removes the human stepping between tasks.

Never run `git commit` (or `git add` followed by a commit) yourself, in either mode, unless the user explicitly asks you to commit in that message. Draft a commit message and tell the user the change is ready, then leave the actual commit to them.

## Before either mode: branch setup

Before the first task in either mode, use the AskUserQuestion tool to confirm branch setup — never create a branch silently. Check whether `dev` exists (locally or on the remote); if it does, fetch and pull it to latest before branching from it, then confirm via the ask that it's fine to create a feature branch from `dev` (pulled to latest). If `dev` doesn't exist, say so explicitly in the same ask and ask which branch to use instead, rather than guessing `main` or any other default. Create the feature branch only after that confirmation comes back.

## Default: one task

Pick the next pending task from the plan. Then:

1. Read the task's acceptance criteria
2. Load relevant context (existing code, patterns, types)
3. Write a failing unit test for the expected behavior (RED) — every task gets one, not just tasks that "need" it. If the task has real core logic (a calculation, a state transition, a validation rule), the test must assert its actual expected behavior, not just that it runs without error — that's what catches a regression later, not just now. Cover every scenario type that genuinely applies (happy path, edge cases, error handling, fix/regression confirmation), not just whichever one is fastest to write — one angle (e.g. only rejecting bad input) is not "tested."
4. Implement the minimum code to pass the test (GREEN)
5. Run the full test suite to check for regressions
6. Run the build to verify compilation
7. Run this project's linter (and type checker, where the language has one) — use whatever commands this project actually defines, never assumed to be npm-based by habit — and fix anything it flags
8. Draft a commit message and tell the user the change is ready to commit — do not run `git commit` yourself
9. Mark the task complete. If this was the last pending task in the plan, run the quality-assurance skill against the spec before stopping — live (real server, real database, real authenticated user, not mocked tests or a suite merely named "e2e") — do this yourself, unprompted, not only when the user asks for it. If full live verification is tedious to set up, use quality-assurance's own graduated fallback (curl/CLI or an automated test against the real dev server, offered via AskUserQuestion) rather than downgrading straight to mocks. Then stop.

## Autonomous: the whole plan (`/build auto`)

Use this once a spec exists and you want to collapse plan + build into one run. It removes the manual stepping between tasks — not the verification, and not the no-auto-commit rule. Every task still earns a passing test; none earns an agent-run commit.

1. Require a spec. Look only for a spec at a known path: specs/<feature-slug>/SPEC.md under the project's external output location (see references/external-output-paths.md), or (legacy) SPEC.md at the repo root. A README or arbitrary doc does NOT count. If none exists, stop and tell the user to run /spec first — do not invent requirements.
2. Establish a clean baseline. Run `git status --porcelain`. Planning artifacts live outside the repo now, so they never appear here — if there are any uncommitted changes at all, stop and ask the user how to handle them; do not commit, stash, or discard anything yourself.
3. Plan if needed. If there is no plans/<feature-slug>-plan.md at the external output location, invoke the planning-and-task-breakdown skill to generate one.
4. Single checkpoint. Present the full plan and wait for an unambiguous affirmative (e.g. "approve", "go", "yes"). Treat hedged responses ("looks reasonable", "I guess") as NOT approved. This is the only human gate — after approval, run autonomously through implementation (but still never auto-commit).
5. Execute every task in dependency order. Use each task's declared dependencies; if they aren't explicit, execute in the order the plan lists them. For each task, run the full default loop above (RED → GREEN → regression → build → lint → draft commit message → mark complete). Since nothing gets committed automatically, the per-task "clean rollback" property now lives in the task-status log and diffs you present, not in git history — call this out to the user, and suggest they commit after each task (or batch) themselves if they want that guarantee restored as real git history.
6. Stop and ask the user (do not push through) when:
   - a test can't be made to pass, the build breaks, or lint fails without an obvious fix → follow the debugging-and-error-recovery skill
   - the spec is ambiguous, or a task needs a decision the spec doesn't cover
   - a task is high-risk or irreversible — auth/permission changes, destructive data migrations, payments, deletions, deploys, anything touching secrets, or anything that would be hard to undo without a commit history to revert to → follow the doubt-driven-development skill and get explicit sign-off before continuing
   After the user resolves a blocker, they re-invoke /build auto — it resumes from the next pending task.
7. Run quality-assurance against the spec once every task is complete — live (real server, real database, real authenticated user), not mocked tests or a suite merely named "e2e" — this is a mandatory action, not something to wait for the user to request. Unit tests passing per task doesn't confirm the whole feature works end-to-end; do this before summarizing, not after the user notices it's missing. If full live verification is tedious to set up, use quality-assurance's own graduated fallback (curl/CLI or an automated test against the real dev server, offered via AskUserQuestion) rather than downgrading straight to mocks.
8. Summarize at the end: tasks completed, tests added, the quality-assurance verdict, commit messages proposed (not yet run), and anything skipped, flagged, or left for the user.

If any step fails, follow the debugging-and-error-recovery skill.
"""
