description = "Turn a one-line feature idea into a decision tree, interrogate it in batched rounds, and produce a ready-to-use prompt plus a detailed spec file"

prompt = """
Invoke the deep-dive skill.

Explore the codebase first — existing patterns, conventions, and separation of concerns relevant to the idea — before asking anything. Decompose the idea into however many branches it actually implies (including a dedicated edge-cases branch), then interrogate the tree in batched frontier rounds per the grilling mechanic, each question carrying a recommended answer. Scale the question count to the tree's real size, never to a fixed target. Flag genuine architectural forks with named approaches and tradeoffs before asking about them.

Require an explicit "yes" to a full restatement before producing output. Then produce two artifacts: a 2-3 paragraph ready-to-use prompt, and a detailed branch-organized spec file (with an Architectural Fit section and per-branch edge cases) saved to docs/deep-dives/<topic-slug>.md.
"""
