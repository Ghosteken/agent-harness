description = "Break work into small verifiable tasks with acceptance criteria and dependency ordering"

prompt = """
Invoke the planning-and-task-breakdown skill.

Read the existing spec (specs/<feature-slug>/SPEC.md under the project's external output location — see references/external-output-paths.md — or legacy in-repo SPEC.md, or equivalent) and the relevant codebase sections. Then:

1. Enter plan mode — read only, no code changes
2. Identify the dependency graph between components
3. Slice work vertically (one complete path per task, not horizontal layers)
4. Write tasks with acceptance criteria and verification steps
5. Add checkpoints between phases
6. Present the plan for human review

Save every plan under plans/<feature-slug>-plan.md in the project's external output location (see references/external-output-paths.md) — never inside the project's own repo — (task list, if kept separately, as plans/<feature-slug>-todo.md). Create the folder if it doesn't exist yet. Check whether a plan for this feature already exists before writing — if so, confirm with the user whether to update it in place or create a new one.
"""
