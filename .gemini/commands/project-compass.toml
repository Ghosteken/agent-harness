description = "Understand an unfamiliar or underspecified project from its docs/codebase — a thorough Overview plus several labeled Suggested Directions"

prompt = """
Invoke the project-compass skill.

Before reading anything, ask directly whether there's additional information to add — more docs, notes, or context that clears up a doubt or blocker — or whether to proceed straight into gathering with what's already been pointed at. If there's more, collect it now; if not, proceed immediately.

Read every document pointed at (including anything just added) and explore the codebase if one exists — never invent what isn't actually there. Before writing anything, tell the user what was found and ask whether anything else should be included.

Since nothing detailed about the project is known going in, ask basic grounding questions before drafting anything — purpose, audience, current stage, hard constraints, explicit out-of-scope. Keep questions at a basic, orienting level only, never as deep or exhaustive as the deep-dive skill's interrogation. Batch them using the grilling skill's frontier mechanic: ask everything currently answerable in one round directly, then recompute what the answers newly unblock for the next round, stopping once the project's basic shape is clear.

Using the story-mode skill's technique, infer the distinct actors/roles (auth/permission logic, user/entity models, doc mentions) and confirm them with the user directly before drafting.

If the material spans more than one repository, give each one its own story-mode-style breakdown first — purpose, role in the larger project, and a per-actor narrative scoped to just that codebase — saved to `briefings/repos/<repo-slug>.md`. Don't blend multiple repos into one narrative.

Break the project into its natural distinct parts — threads, phases, sub-systems, whatever real seams the material and grounding actually surfaced, not invented divisions. For each part, assess its readiness against what grounding actually cleared: any real open question (an unconfirmed requirement, an ambiguous rule, a pending dependency) means it's not ready yet — name that specific blocker. A part with doubts cleared, or only minor non-blocking ones left, is ready — note the recommended next command (deep-dive if it still needs interrogating, or spec/breakdown-feature-prd if it's concrete enough already) and a one-line reason.

Then write one detailed, plain-language Project Overview with three parts in the same document: what this project actually is (purpose, current state, stack/domain, unresolved gaps); a continuous-prose per-actor narrative section following story-mode's approach — not a bulleted summary; and a "Ready to Build" section listing the ready parts (with recommended command + reason) and the not-yet-ready parts (with their specific blocker). If per-repo breakdowns were written, add a "Repositories in This Project" section too: a short paragraph per repo linking to its full breakdown, not a duplicate of its content. Mark genuine gaps as gaps rather than filling them with a plausible guess.

From what was actually found, identify at least two — typically two or three, more for a larger or more complex project — genuinely distinct directions the project could go next. Write one Suggested Directions document per direction: the shape of the approach, its key tradeoffs, and what would need to be confirmed before it became a real plan. Label every one explicitly as an option, never as a decided plan.

Save the Overview to `briefings/overview.md`, each repo breakdown to `briefings/repos/<repo-slug>.md`, and each direction to `briefings/directions/<direction-slug>.md` in the project's external output location (see references/external-output-paths.md) — never inside the project's own repo. Maintain an index at `briefings/README.md` linking the Overview, every repo breakdown, and every direction. Tell the user the full paths written, which actors the Overview covers, which repos got their own breakdown, which parts are ready to build right now with their recommended command, and the natural next skill (deep-dive, breakdown-feature-prd, or spec-driven-development) for whichever Suggested Direction they choose to pursue instead.
"""
